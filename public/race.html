<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Mode - Racerboy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="theme-race">
    <nav>
        <a href="/training.html">Training</a>
        <a href="/race.html" class="active">Race</a>
        <a href="/config.html">Config</a>
        <a href="/help.html">Help</a>
    </nav>
    
    <div class="container">
        <div class="header-banner card" style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
            <div style="text-align: left;">
                <h1 style="margin: 0;" id="race-status">Stopped</h1>
                <div class="stat-label">Heat <span id="current-heat">1</span> of <span id="total-heats">4</span></div>
            </div>
            
            <div style="text-align: center;">
                <div class="stat-label">Remaining Time</div>
                <div class="stat-value mono huge" id="time-remaining">00:00</div>
            </div>
            
            <div style="display: flex; gap: 1rem;" id="control-buttons">
                <!-- Dynamically populated buttons -->
            </div>
        </div>
        
        <!-- Start Lights Container -->
        <div id="start-lights-container" style="display: none; justify-content: center; gap: 1rem; margin-bottom: 2rem;">
            <div class="start-light" id="light-1" style="width: 40px; height: 40px; border-radius: 50%; background: #333; border: 3px solid rgba(255,255,255,0.5);"></div>
            <div class="start-light" id="light-2" style="width: 40px; height: 40px; border-radius: 50%; background: #333; border: 3px solid rgba(255,255,255,0.5);"></div>
            <div class="start-light" id="light-3" style="width: 40px; height: 40px; border-radius: 50%; background: #333; border: 3px solid rgba(255,255,255,0.5);"></div>
            <div class="start-light" id="light-4" style="width: 40px; height: 40px; border-radius: 50%; background: #333; border: 3px solid rgba(255,255,255,0.5);"></div>
            <div class="start-light" id="light-5" style="width: 40px; height: 40px; border-radius: 50%; background: #333; border: 3px solid rgba(255,255,255,0.5);"></div>
        </div>
        
        <div class="grid-2" id="lanes-container">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Template for Lane -->
    <template id="lane-template">
        <div class="card lane-card" style="position: relative;">
            <div class="power-indicator" style="display: none; position: absolute; top: 1.5rem; right: 2rem; width: 14px; height: 14px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444;" title="Power ON"></div>
            
            <div class="penalty-overlay" style="display: none; position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255,0,0,0.8); color: white; border-radius: var(--radius-lg); z-index: 10; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold;">
                PENALTY (False Start)
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <input type="text" class="lane-name-input" list="driver-list" style="font-size: 2rem; font-weight: bold; background: transparent; border: none; border-bottom: 2px solid rgba(255,255,255,0.2); color: inherit; width: 100%; outline: none;" placeholder="Driver Name" spellcheck="false" autocomplete="off" />
                    
                    <div class="stat-group" style="margin-top: 2rem;">
                        <div class="stat-label">Laps</div>
                        <div class="stat-value huge mono lane-laps">0</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <div class="stat-group" style="margin-bottom: 1rem;">
                        <div class="stat-label">Fastest Lap</div>
                        <div class="stat-value mono lane-best-lap" style="font-size: 2rem;">0.000</div>
                    </div>
                    <div class="stat-group">
                        <div class="stat-label">Average Lap</div>
                        <div class="stat-value mono lane-avg-lap" style="font-size: 1.5rem; opacity: 0.8;">0.000</div>
                    </div>
                </div>
            </div>
            
             <button class="crash-btn" style="margin-top: 1rem; font-size: 1rem; padding: 0.5rem; width: 100%; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">MARK CRASHED</button>
             <!-- Debug only -->
             <button class="debug-btn" style="margin-top: 1rem; font-size: 0.8rem; padding: 0.5rem;" onclick="">Simulate Lap (Mac)</button>
        </div>
    </template>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            app.apiCommand('setMode', { mode: 'race' });
            
            app.onStateUpdate((state) => {
                if (!state || !state.lanes) return;
                
                // Top header
                document.getElementById('race-status').textContent = state.status.toUpperCase();
                
                if (state.status === 'stopped' && state.currentHeat > 1 && state.currentHeat <= state.totalHeats) {
                    document.getElementById('race-status').textContent = 'SWITCH LANES';
                }
                
                document.getElementById('current-heat').textContent = state.currentHeat > state.totalHeats ? state.totalHeats : state.currentHeat;
                document.getElementById('total-heats').textContent = state.totalHeats;
                
                const timeEl = document.getElementById('time-remaining');
                timeEl.textContent = app.formatTimeRemaining(state.timeRemainingMs);
                if (state.timeRemainingMs < 0) {
                    timeEl.style.color = 'var(--lane-red)';
                } else {
                    timeEl.style.color = '';
                }
                
                // Update Buttons based on state
                const btnContainer = document.getElementById('control-buttons');
                btnContainer.innerHTML = '';
                if (state.status === 'stopped') {
                    const startBtn = document.createElement('button');
                    startBtn.textContent = state.currentHeat === 1 ? 'START RACE' : 'START NEXT HEAT';
                    startBtn.onclick = () => app.apiCommand('startRace');
                    startBtn.style.background = 'var(--lane-green)';
                    btnContainer.appendChild(startBtn);
                    
                    const cancelBtn = document.createElement('button');
                    cancelBtn.textContent = 'CANCEL RACE';
                    cancelBtn.onclick = () => app.apiCommand('stopRace');
                    cancelBtn.style.background = 'var(--lane-red)';
                    btnContainer.appendChild(cancelBtn);
                } else if (state.status === 'finished') {
                    const newRaceBtn = document.createElement('button');
                    newRaceBtn.textContent = 'NEW RACE';
                    newRaceBtn.onclick = () => app.apiCommand('stopRace');
                    newRaceBtn.style.background = 'var(--lane-blue)';
                    btnContainer.appendChild(newRaceBtn);
                } else if (state.status === 'running') {
                    const pauseBtn = document.createElement('button');
                    pauseBtn.textContent = 'PAUSE';
                    pauseBtn.onclick = () => app.apiCommand('pauseRace');
                    btnContainer.appendChild(pauseBtn);
                } else if (state.status === 'paused') {
                    const resumeBtn = document.createElement('button');
                    resumeBtn.textContent = 'RESUME';
                    resumeBtn.onclick = () => app.apiCommand('resumeRace');
                    resumeBtn.style.background = 'var(--lane-green)';
                    btnContainer.appendChild(resumeBtn);
                    
                    const cancelBtn = document.createElement('button');
                    cancelBtn.textContent = 'CANCEL';
                    cancelBtn.onclick = () => app.apiCommand('stopRace');
                    cancelBtn.style.background = 'var(--lane-red)';
                    btnContainer.appendChild(cancelBtn);
                } else if (state.status === 'starting') {
                    const cancelBtn = document.createElement('button');
                    cancelBtn.textContent = 'CANCEL';
                    cancelBtn.onclick = () => app.apiCommand('stopRace');
                    cancelBtn.style.background = 'var(--lane-red)';
                    btnContainer.appendChild(cancelBtn);
                }
                
                // Update Start Lights
                const lightsContainer = document.getElementById('start-lights-container');
                if (state.status === 'starting') {
                    lightsContainer.style.display = 'flex';
                    for (let i = 1; i <= 5; i++) {
                        const light = document.getElementById(`light-${i}`);
                        if (i <= state.currentLight) {
                            light.style.background = 'var(--lane-red)';   
                        } else {
                            light.style.background = '#333';
                        }
                    }
                } else {
                    lightsContainer.style.display = 'none';
                }
                
                const container = document.getElementById('lanes-container');
                const tpl = document.getElementById('lane-template');
                
                Object.values(state.lanes).forEach(lane => {
                    let card = document.getElementById(`lane-${lane.hwId}`);
                    if (!card) {
                        const clone = tpl.content.cloneNode(true);
                        card = clone.querySelector('.lane-card');
                        card.id = `lane-${lane.hwId}`;
                        
                        // Default hidden penalty
                        card.querySelector('.penalty-overlay').style.display = 'none';

                        container.appendChild(clone);
                        
                        card.querySelector('.debug-btn').onclick = () => {
                            app.apiCommand('mockLap', { laneId: lane.hwId });
                        };
                        card.querySelector('.crash-btn').onclick = () => {
                            app.apiCommand('setCrashed', { laneId: lane.hwId, isCrashed: !lane.isCrashed });
                        };
                        
                        const nameInput = card.querySelector('.lane-name-input');
                        if (nameInput) {
                            nameInput.addEventListener('change', (e) => {
                                app.apiCommand('setDriverName', { laneId: lane.hwId, name: e.target.value });
                                setTimeout(() => app.fetchDrivers(), 200);
                            });
                        }
                    }
                    
                    // Update content
                    card.setAttribute('data-color', lane.color);
                    
                    const nameInput = card.querySelector('.lane-name-input');
                    if (nameInput && document.activeElement !== nameInput) {
                        nameInput.value = lane.name || `Lane ${lane.hwId}`;
                    }
                    
                    // Power Indicator
                    const powerDot = card.querySelector('.power-indicator');
                    if (powerDot) {
                        powerDot.style.display = lane.isPowerOn ? 'block' : 'none';
                    }
                    
                    // Include estimated distance
                    const totalLaps = lane.laps + (lane.distanceEst || 0);
                    card.querySelector('.lane-laps').textContent = totalLaps.toFixed(2);
                    
                    card.querySelector('.lane-best-lap').textContent = app.formatMs(lane.bestLapTimeMs);
                    card.querySelector('.lane-avg-lap').textContent = app.formatMs(lane.averageLapTimeMs);

                    // Penalty overlay
                    const penaltyEl = card.querySelector('.penalty-overlay');
                    if (lane.penaltyUntil > Date.now()) {
                        penaltyEl.style.display = 'flex';
                    } else {
                        penaltyEl.style.display = 'none';
                    }
                    
                    // Crash button state
                    const crashBtn = card.querySelector('.crash-btn');
                    if (crashBtn) {
                        if (lane.isCrashed) {
                            crashBtn.textContent = 'CAR CRASHED (RESUME?)';
                            crashBtn.style.background = '#fbbf24'; // amber
                            crashBtn.style.color = '#000';
                            card.style.opacity = '0.5';
                        } else {
                            crashBtn.textContent = 'MARK CRASHED';
                            crashBtn.style.background = 'var(--lane-red)';
                            crashBtn.style.color = '#fff';
                            card.style.opacity = '1';
                        }
                    }
                    
                    // Winner highlight
                    if (lane.isWinner) {
                        card.style.boxShadow = '0 0 30px #ffd700';
                        card.style.border = '2px solid #ffd700';
                    } else {
                        card.style.boxShadow = '';
                        card.style.border = '';
                    }
                });
            });
        });
    </script>
</body>
</html>
